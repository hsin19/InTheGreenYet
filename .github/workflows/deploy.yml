name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Deploy-specific permissions are granted only on the deploy job
permissions:
  contents: read

# One production deploy at a time. Queued runs collapse to the latest, but an
# in-flight deploy is never cancelled -- a half-applied Worker upload is worse
# than a slightly stale one.
concurrency:
  group: 'deploy'
  cancel-in-progress: false

jobs:
  # Same definition pr.yml gates a PR with, e2e included, so a direct push to
  # `main` is held to the same bar -- and its Codecov upload is the baseline every
  # later PR is diffed against, since this is the only place the suite runs on the
  # default branch.
  check:
    uses: ./.github/workflows/check.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Builds again rather than reusing check's build: what ships carries
  # VITE_GIT_SHA, which the check build has no reason to set, and `wrangler deploy`
  # reads the `.wrangler/deploy` redirect config that this build emits.
  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm version comes from package.json's packageManager field
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          VITE_GIT_SHA: ${{ github.sha }}

      # wrangler-action pushes every secret it is given, so an empty value would
      # silently replace the live one with "" and break Notion login. Refuse the
      # deploy instead.
      - name: Verify required vars and secrets
        env:
          NOTION_CLIENT_ID: ${{ vars.NOTION_CLIENT_ID }}
          NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
        run: |
          missing=""
          [ -n "$NOTION_CLIENT_ID" ] || missing="$missing vars.NOTION_CLIENT_ID"
          [ -n "$NOTION_CLIENT_SECRET" ] || missing="$missing secrets.NOTION_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Empty:$missing — refusing to overwrite the Worker secrets"
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
          secrets: |
            NOTION_CLIENT_ID
            NOTION_CLIENT_SECRET
        env:
          NOTION_CLIENT_ID: ${{ vars.NOTION_CLIENT_ID }}
          NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}

      # wrangler-action reports a custom-domain deploy as `<host> (custom domain)`
      # -- a label, not a URL -- so the host has to be taken off the front and given
      # a scheme. A workers.dev deploy returns a real URL, hence the scheme check
      # rather than an unconditional prefix.
      - name: Smoke check deployed Worker
        run: |
          raw="${{ steps.deploy.outputs.deployment-url }}"
          host="${raw%% *}"
          if [ -z "$host" ]; then
            echo "::warning::No deployment URL returned — skipping health smoke check"
            exit 0
          fi
          case "$host" in
            http://*|https://*) url="$host" ;;
            *) url="https://$host" ;;
          esac
          echo "Probing $url/health"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 "$url/health" | grep -q '"status":"ok"'
