version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint 的 peer 上限卡在 TS 6，載入 TS 7 會直接拋錯讓 lint 掛掉。
      # 解除條件：typescript-eslint 支援 TS 7（typescript-eslint#10940）。
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    # 以下群組是「必須同版一起升」的套件：分開升會版本錯位，整輪檢查全紅。
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      cloudflare:
        patterns:
          - 'wrangler'
          - '@cloudflare/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'vitest-browser-*'
      lingui:
        patterns:
          - '@lingui/*'
      playwright:
        patterns:
          - 'playwright'
          - '@playwright/*'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
      non-major:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
        exclude-patterns:
          - 'cloudflare/wrangler-action'
      # wrangler-action 只在 push main 的 deploy job 執行，PR 檢查永遠跑不到它，
      # 升級等於未經驗證直上生產部署——獨立成組，pr.yml 依組名跳過 auto-merge。
      deploy-actions:
        patterns:
          - 'cloudflare/wrangler-action'
